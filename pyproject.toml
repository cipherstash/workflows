# Settings for Ruff and mypy, which the python-checks job in .github/workflows/checks.yml runs over all the Python in
# this repository. This repository is not a Python package: this file holds tool settings only.

[tool.ruff]
# The reusable workflow's steps run on the runner's python3, and keep to Python 3.10.
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# pycodestyle, Pyflakes and import order; bugbear, blind except and flake8-bandit for likely bugs and unsafe code;
# pyupgrade for Python 3.10 idioms; Ruff's own rules, simplifications, comprehensions, unnecessary code; and Pylint's
# error and warning rules.
select = ["E", "W", "F", "I", "B", "BLE", "UP", "RUF", "SIM", "C4", "PIE", "S", "PLE", "PLW"]

[tool.mypy]
# Checks steps/ and tests/ as written for Python 3.10, whichever Python runs mypy. Each file there is its own
# top-level module, as when python3 runs it with its directory first on the path.
python_version = "3.10"
files = ["steps", "tests"]
# Checks the body of every function, typed or not.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# The step files, which are what the reusable workflow runs, are fully typed so that mypy checks every call between
# them. A new step file is added to this list.
[[tool.mypy.overrides]]
module = ["fire", "helpers", "lookup", "report"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
warn_return_any = true
