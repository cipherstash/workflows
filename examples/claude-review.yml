# Asks Claude for a code review of a pull request, using the shared workflow in cipherstash/workflows. Copy this file
# to .github/workflows/claude-review.yml in a repository to add the review there.
#
# Reviews a non-draft pull request when it is opened or reopened, or when a draft is marked ready for review, if its
# author is a member of the @cipherstash/developers team. A team member can also ask for a review, on drafts too, by
# commenting on a pull request with a first line starting `@cipherstash-agent review`; the rest of the comment is passed
# on as instructions, and the comment gets a 👀 reaction once the request is sent. The rules live in the shared
# workflow, pinned below by commit.
#
# Comments run this file from the default branch, so the comment command works only once this file is merged there.
#
# Needs, as organisation or repository settings:
#   secret CLAUDE_ROUTINE_TOKEN           the code-review routine's bearer token
#   secret CLAUDE_REVIEW_APP_ID           the membership GitHub App's id
#   secret CLAUDE_REVIEW_APP_PRIVATE_KEY  the membership GitHub App's private key
#   variable CLAUDE_ROUTINE_TRIGGER_ID    the routine's trigger id (`trig_…`)
name: Claude review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  review:
    # Saves starting runners for comments that cannot be a comment command: only comments on pull requests that mention
    # the review agent (contains ignores case) go on. The shared workflow still checks every rule itself.
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request && contains(github.event.comment.body, '@cipherstash-agent'))
    # The shared workflow's jobs can hold no more than this. Only its reaction job uses it, to add 👀 to a comment
    # command; its other jobs hold no permissions.
    permissions:
      issues: write
    uses: cipherstash/workflows/.github/workflows/claude-review.yml@7d4aa83e871a1ba16eff02079c5a5c44cae47a3d # feat/comment-command (pre-release)
    with:
      routine-trigger-id: ${{ vars.CLAUDE_ROUTINE_TRIGGER_ID }}
    secrets:
      CLAUDE_ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
      CLAUDE_REVIEW_APP_ID: ${{ secrets.CLAUDE_REVIEW_APP_ID }}
      CLAUDE_REVIEW_APP_PRIVATE_KEY: ${{ secrets.CLAUDE_REVIEW_APP_PRIVATE_KEY }}
