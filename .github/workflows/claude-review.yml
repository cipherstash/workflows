# Asks Claude for a code review of a pull request: decides whether the calling event is a review request from a team
# member and, if it is, fires the Claude code-review routine trigger for that pull request.
#
# Called from a short caller workflow in each repository (see examples/claude-review.yml). A reusable workflow runs in
# the calling repository, so the decide job checks out the request decision, request-decision/decision.jq, from this
# repository at the commit the caller pinned, and request-decision/test runs that same file against saved cases. The
# Python steps' scripts are inline, and the unit tests in tests/ read them out of this file and run them.
#
# Kinds of review request handled so far: Ready (a non-draft pull request opened or reopened, or a draft marked ready
# for review). Drafts, bots' pull requests, forks and deleted forks are skipped, and so is a pull request whose author
# is not a team member. A pull request opened by the review agent is reviewed without a membership lookup.
name: Claude review

on:
  workflow_call:
    inputs:
      routine-trigger-id:
        description: The Claude code-review routine's trigger id (`trig_…`), usually `vars.CLAUDE_ROUTINE_TRIGGER_ID`.
        type: string
        required: true
      team:
        description: The slug of the team, in the calling repository's owner organisation, whose members may request a review.
        type: string
        default: developers
      review-agent:
        description: The login of the review agent, the account whose pull requests are reviewed without a membership lookup.
        type: string
        default: cipherstash-agent
    secrets:
      CLAUDE_ROUTINE_TOKEN:
        description: The code-review routine's bearer token.
        required: true
      CLAUDE_REVIEW_APP_ID:
        description: The id of the GitHub App, installed on the organisation with only "Members, read", that looks up team membership.
        required: true
      CLAUDE_REVIEW_APP_PRIVATE_KEY:
        description: That GitHub App's private key.
        required: true

permissions: {}

jobs:
  # Decides whether the event is a review request to send on. Untrusted text (titles, branch names, logins) is read
  # from the event payload file or passed through environment variables, never placed in a script by an expression.
  # Every failure here ends as a skip with an error annotation; the job itself stays green, because every step that
  # can fail has continue-on-error.
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      decision: ${{ steps.final.outputs.decision }}
    env:
      # The request decision's jq program, from this repository's checkout (the checkout step below).
      REQUEST_DECISION_FILE: ${{ github.workspace }}/.cipherstash-workflows/request-decision/decision.jq
    steps:
      # A reusable workflow runs in the calling repository, so the request decision is checked out from this repository
      # at the commit the caller pinned: job.workflow_repository and job.workflow_sha name the reusable workflow, not
      # the caller. Only the decision's file is checked out. This job checks out no caller files, so its workspace is
      # empty and the directory name is only a label. No credentials are kept. The step is skipped if either value is empty, so it never falls back to the caller's repository and
      # the pull request's own code.
      - name: Check out the request decision
        id: checkout
        if: job.workflow_repository != '' && job.workflow_sha != ''
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .cipherstash-workflows
          sparse-checkout: /request-decision/decision.jq
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Decide (before any membership lookup)
        id: first
        continue-on-error: true
        env:
          REVIEW_AGENT: ${{ inputs.review-agent }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
        run: |
          # Without the checked-out decision there is nothing to run: this step fails, and the decision-failed skip
          # stands.
          if [[ "$CHECKOUT_OUTCOME" != success || ! -f "$REQUEST_DECISION_FILE" ]]; then
            echo "::error::Could not get the request decision (checkout failed or file missing); no review was requested"
            exit 1
          fi
          request="$RUNNER_TEMP/request.json"
          jq --null-input --compact-output \
            --arg event_name "$GITHUB_EVENT_NAME" \
            --arg review_agent "$REVIEW_AGENT" \
            --slurpfile event "$GITHUB_EVENT_PATH" \
            '{event_name: $event_name, event: $event[0], review_agent: $review_agent, membership: null}' >"$request"
          # Writes one step output. A random delimiter makes any value safe, even one with a newline in it.
          output() {
            local delimiter
            delimiter="ghadelim_$(cat /proc/sys/kernel/random/uuid)"
            printf '%s<<%s\n%s\n%s\n' "$1" "$delimiter" "$2" "$delimiter" >>"$GITHUB_OUTPUT"
          }
          decision="$(jq --compact-output --from-file "$REQUEST_DECISION_FILE" "$request")"
          requester="$(jq --raw-output '.requester // ""' <<<"$decision")"
          if [[ "$(jq --raw-output '.decision' <<<"$decision")" == lookup ]]; then
            needs_lookup=true
          else
            needs_lookup=false
          fi
          output decision "$decision"
          output requester "$requester"
          # The later steps test this one output, not the decision's text.
          output needs-lookup "$needs_lookup"

      - name: Create the membership App's token
        id: app-token
        if: steps.first.outputs.needs-lookup == 'true'
        # A failed token is reported by the next step and skips the request.
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CLAUDE_REVIEW_APP_ID }}
          private-key: ${{ secrets.CLAUDE_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-members: read

      - name: Look up team membership
        id: lookup
        if: steps.first.outputs.needs-lookup == 'true'
        continue-on-error: true
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          TOKEN_OUTCOME: ${{ steps.app-token.outcome }}
          ORG: ${{ github.repository_owner }}
          TEAM: ${{ inputs.team }}
          REQUESTER: ${{ steps.first.outputs.requester }}
        # Python's standard library only (3.10 features), so nothing is installed; tests/test_lookup.py runs this script.
        shell: python3 {0}
        run: |
          # Membership is never assumed: anything but a clear answer from GitHub is "lookup-failed", which skips.
          import contextlib
          import http.client
          import json
          import os
          import re
          import signal
          import urllib.error
          import urllib.request
          import uuid

          # Seconds to wait to connect, and then for each read of the answer.
          TIMEOUT_SECONDS = 10
          # Seconds one request may take in all, however slowly the answer arrives.
          TOTAL_SECONDS = 30
          # The most of an answer's body that is read. A membership is far smaller; a larger answer is not one.
          MAX_BODY_BYTES = 64 * 1024

          # Names go into the URL, so each must start with a letter, digit or (for a team) underscore, which keeps "."
          # and ".." out. A login is letters and digits joined by single hyphens (or underscores, for managed users).
          ORG_NAME = re.compile(r"[A-Za-z0-9][A-Za-z0-9-]*")
          TEAM_NAME = re.compile(r"[A-Za-z0-9_][A-Za-z0-9_.-]*")
          LOGIN = re.compile(r"[A-Za-z0-9]+(?:[-_][A-Za-z0-9]+)*")


          class LookupFailed(Exception):
              """Membership could not be checked; the message says why."""


          class TotalTimeout(Exception):
              """One request took longer than TOTAL_SECONDS."""


          def escaped(message):
              """message escaped as GitHub's workflow commands require, so no value can end an annotation or start another."""
              return message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")


          def error(message):
              print(f"::error::{escaped(message)}", flush=True)


          def output(name, value):
              # A random delimiter makes any value safe, even one with a newline in it.
              delimiter = f"ghadelim_{uuid.uuid4()}"
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as file:
                  file.write(f"{name}<<{delimiter}\n{value}\n{delimiter}\n")


          class NoRedirects(urllib.request.HTTPRedirectHandler):
              # A redirect is an answer to report, not to follow: following it could send the token somewhere else.
              def redirect_request(self, *args, **kwargs):
                  return None


          # urllib.request reads the proxy settings of the environment (http_proxy, https_proxy and no_proxy, in either
          # case) by default, but not ALL_PROXY.
          opener = urllib.request.build_opener(NoRedirects)


          def on_total_timeout(signum, frame):
              raise TotalTimeout()


          @contextlib.contextmanager
          def total_time_limit():
              """Raises TotalTimeout inside the block once TOTAL_SECONDS have passed. The block can end the limit early with
              signal.setitimer(signal.ITIMER_REAL, 0). Leaving the block ends the limit and puts the previous SIGALRM handler
              back, even if the alarm comes while that happens."""
              previous = signal.signal(signal.SIGALRM, on_total_timeout)
              signal.setitimer(signal.ITIMER_REAL, TOTAL_SECONDS)
              try:
                  yield
              finally:
                  try:
                      signal.setitimer(signal.ITIMER_REAL, 0)
                  finally:
                      signal.signal(signal.SIGALRM, previous)


          def api(path, token):
              """GETs path from the GitHub API and returns (status, body), reading at most MAX_BODY_BYTES + 1 bytes of an
              answer. The token is only ever a request header."""
              request = urllib.request.Request(
                  f"{os.environ['GITHUB_API_URL']}/{path}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              result = None
              try:
                  with total_time_limit():
                      try:
                          with opener.open(request, timeout=TIMEOUT_SECONDS) as response:
                              # Read with the time limit running: a 200's body is the membership, so one cut off is a
                              # lookup-failed.
                              result = (response.status, response.read(MAX_BODY_BYTES + 1))
                      except urllib.error.HTTPError as answer:
                          # The body of a status other than 200 is never used.
                          answer.close()
                          result = (answer.code, b"")
              except (OSError, http.client.HTTPException, ValueError, TotalTimeout) as failure:
                  if result is not None:  # The alarm came after the answer was complete.
                      return result
                  # URLError, timeouts, refused or dropped connections, a cut-off answer. Only the failure's kind is
                  # reported.
                  reason = getattr(failure, "reason", failure)
                  raise LookupFailed(f"Could not reach GitHub to look up team membership ({type(reason).__name__})")
              return result


          def look_up(token, org, team, requester):
              if os.environ.get("TOKEN_OUTCOME") != "success" or not token:
                  raise LookupFailed(
                      "Could not create the membership App's token: check the CLAUDE_REVIEW_APP_ID and "
                      f"CLAUDE_REVIEW_APP_PRIVATE_KEY secrets, and that the App is installed on {org} with Members: read"
                  )
              if not (ORG_NAME.fullmatch(org) and TEAM_NAME.fullmatch(team) and LOGIN.fullmatch(requester)):
                  raise LookupFailed(
                      "Cannot look up team membership: the organisation, team or requester is not a valid GitHub name"
                  )
              status, body = api(f"orgs/{org}/teams/{team}/memberships/{requester}", token)
              if status == 200:
                  try:
                      membership = json.loads(body) if len(body) <= MAX_BODY_BYTES else None
                  except ValueError:
                      membership = None
                  if not isinstance(membership, dict):
                      raise LookupFailed(
                          f"Cannot look up team membership in {org}/{team}: GitHub's answer was not a membership"
                      )
                  # A pending invitation is not membership.
                  return "member" if membership.get("state") == "active" else "not-member"
              if status == 404:
                  # GitHub also answers 404 for a team that does not exist, which would otherwise skip everyone quietly.
                  team_status, _ = api(f"orgs/{org}/teams/{team}", token)
                  if team_status == 200:
                      return "not-member"
                  raise LookupFailed(
                      f"Cannot look up team membership: team {org}/{team} was not found (HTTP {team_status}); "
                      "check the team input and the App's installation"
                  )
              raise LookupFailed(f"Cannot look up team membership in {org}/{team}: GitHub answered HTTP {status}")


          membership = "lookup-failed"
          try:
              membership = look_up(
                  os.environ.get("APP_TOKEN", ""),
                  os.environ.get("ORG", ""),
                  os.environ.get("TEAM", ""),
                  os.environ.get("REQUESTER", ""),
              )
          except LookupFailed as failure:
              error(str(failure))
          except Exception as failure:  # Anything unexpected still ends as a reported lookup-failed, never a member.
              error(f"Cannot look up team membership: the lookup broke ({type(failure).__name__})")
          output("membership", membership)

      - name: Decide (with the membership lookup's result)
        id: second
        if: steps.first.outputs.needs-lookup == 'true'
        continue-on-error: true
        env:
          MEMBERSHIP: ${{ steps.lookup.outputs.membership || 'lookup-failed' }}
        run: |
          # Writes one step output. A random delimiter makes any value safe, even one with a newline in it.
          output() {
            local delimiter
            delimiter="ghadelim_$(cat /proc/sys/kernel/random/uuid)"
            printf '%s<<%s\n%s\n%s\n' "$1" "$delimiter" "$2" "$delimiter" >>"$GITHUB_OUTPUT"
          }
          decision="$(jq --compact-output --arg membership "$MEMBERSHIP" '.membership = $membership' "$RUNNER_TEMP/request.json" \
            | jq --compact-output --from-file "$REQUEST_DECISION_FILE")"
          output decision "$decision"

      - name: Report the decision
        id: final
        if: always()
        # This step must not fail, because the fire job reads its output. It writes the "decision-failed" skip first, so
        # that if anything below breaks, that skip is what the fire job sees; the valid decision then replaces it.
        continue-on-error: true
        env:
          FIRST: ${{ steps.first.outputs.decision }}
          SECOND: ${{ steps.second.outputs.decision }}
        # Python's standard library only (3.10 features), so nothing is installed; tests/test_report.py runs this script.
        shell: python3 {0}
        run: |
          import json
          import os
          import uuid

          FAILED = '{"decision":"skip","reason":"decision-failed"}'


          def output(name, value):
              # A random delimiter makes any value safe, even one with a newline in it.
              delimiter = f"ghadelim_{uuid.uuid4()}"
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as file:
                  file.write(f"{name}<<{delimiter}\n{value}\n{delimiter}\n")


          def finished(value):
              """The decision value parsed, if it is a finished decision (a skip or a fire), or else None."""
              try:
                  decision = json.loads(value)
              except ValueError:
                  return None
              if isinstance(decision, dict) and decision.get("decision") in ("skip", "fire"):
                  return decision
              return None


          def text(value):
              # As jq's string interpolation: a string as it is, anything else as JSON.
              return value if isinstance(value, str) else json.dumps(value)


          def summary(decision):
              if decision.get("decision") == "fire":
                  pull_request = decision.get("pull_request")
                  number = pull_request.get("number") if isinstance(pull_request, dict) else None
                  line = (
                      f"Claude review: requested ({text(decision.get('kind'))}, by @{text(decision.get('requester'))}, "
                      f"pull request #{text(number)})"
                  )
              else:
                  line = f"Claude review: skipped ({text(decision.get('reason'))})"
              # One line, whatever the decision holds, so it cannot start a workflow command.
              return line.replace("\r", " ").replace("\n", " ")


          try:
              output("decision", FAILED)
              value = os.environ.get("SECOND") or os.environ.get("FIRST") or ""
              decision = finished(value)
              if decision is None:
                  print("::error::The request decision did not finish; no review was requested", flush=True)
                  value, decision = FAILED, json.loads(FAILED)
              if decision.get("reason") == "membership-lookup-failed":
                  print("::error::Team membership could not be checked, so no review was requested", flush=True)
              # Passed on as the decision step wrote it.
              output("decision", value)
              line = summary(decision)
              print(line, flush=True)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as file:
                  file.write(line + "\n")
          except Exception as failure:  # The decision-failed skip, written first, stands.
              print(f"::error::Could not report the request decision ({type(failure).__name__})", flush=True)

  # Fires the routine trigger. It holds no permissions and sees only the decision, never the event's free text.
  fire:
    needs: decide
    if: fromJSON(needs.decide.outputs.decision).decision == 'fire'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    # One request per pull request at a time. A second waits rather than cancelling the first, whose request may already
    # have started a session; a third replaces the waiting one. This serialises only the fire request, not the review
    # session it starts, so sessions can overlap.
    concurrency:
      group: claude-review-${{ github.repository }}-${{ fromJSON(needs.decide.outputs.decision).pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Fire the code-review routine
        id: send
        # The review is advisory: a failed request (an outage, a revoked token) shows as a failed step in this run, not
        # as a red check on the pull request.
        continue-on-error: true
        env:
          CLAUDE_ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
          TRIGGER_ID: ${{ inputs.routine-trigger-id }}
          DECISION: ${{ needs.decide.outputs.decision }}
        # Python's standard library only (3.10 features), so nothing is installed; tests/test_fire.py runs this script.
        shell: python3 {0}
        run: |
          # Only a 2xx answer counts as sent. Anything else is an error annotation and a failed step, which the job's
          # continue-on-error keeps from turning the check red.
          import contextlib
          import http.client
          import json
          import os
          import re
          import signal
          import sys
          import urllib.error
          import urllib.request
          import uuid

          # The routine API's address. It is fixed here: no input or event field can change where the token goes.
          API_BASE_URL = "https://api.anthropic.com"
          # Seconds to wait to connect, and then for each read of the answer.
          TIMEOUT_SECONDS = 10
          # Seconds one request may take in all, however slowly the answer arrives.
          TOTAL_SECONDS = 30
          # The most of an error answer's body shown in the annotation.
          EXCERPT_CHARACTERS = 200

          # The id goes into the URL, so anything but a trigger id is refused.
          TRIGGER_ID = re.compile(r"trig_[A-Za-z0-9]+")


          class NotSent(Exception):
              """The request was not sent, or the routine trigger did not accept it; the message says why."""


          class TotalTimeout(Exception):
              """One request took longer than TOTAL_SECONDS."""


          def escaped(message):
              """message escaped as GitHub's workflow commands require, so no value can end an annotation or start another."""
              return message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")


          def error(message):
              print(f"::error::{escaped(message)}", flush=True)


          def output(name, value):
              # A random delimiter makes any value safe, even one with a newline in it.
              delimiter = f"ghadelim_{uuid.uuid4()}"
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as file:
                  file.write(f"{name}<<{delimiter}\n{value}\n{delimiter}\n")


          def excerpt(body, token):
              """The start of an answer's body, on one line, with the token taken out in case the answer repeats it."""
              text = body.decode("utf-8", errors="replace").replace(token, "[token]")
              text = " ".join("".join(c if c.isprintable() else " " for c in text).split())
              if len(text) > EXCERPT_CHARACTERS:
                  text = text[:EXCERPT_CHARACTERS] + "…"
              return text


          class NoRedirects(urllib.request.HTTPRedirectHandler):
              # A redirect is an answer to report, not to follow: following it could send the token somewhere else.
              def redirect_request(self, *args, **kwargs):
                  return None


          # urllib.request reads the proxy settings of the environment (http_proxy, https_proxy and no_proxy, in either
          # case) by default, but not ALL_PROXY.
          opener = urllib.request.build_opener(NoRedirects)


          def on_total_timeout(signum, frame):
              raise TotalTimeout()


          @contextlib.contextmanager
          def total_time_limit():
              """Raises TotalTimeout inside the block once TOTAL_SECONDS have passed. The block can end the limit early with
              signal.setitimer(signal.ITIMER_REAL, 0). Leaving the block ends the limit and puts the previous SIGALRM handler
              back, even if the alarm comes while that happens."""
              previous = signal.signal(signal.SIGALRM, on_total_timeout)
              signal.setitimer(signal.ITIMER_REAL, TOTAL_SECONDS)
              try:
                  yield
              finally:
                  try:
                      signal.setitimer(signal.ITIMER_REAL, 0)
                  finally:
                      signal.signal(signal.SIGALRM, previous)


          def post(url, token, body):
              """POSTs body to url once and returns (status, the start of an error answer's body, or b"" for a 2xx answer).
              There is no retry: a request that timed out may still have started a session, and a second would review twice.
              A failed request is re-run by hand. The token is only ever a request header."""
              request = urllib.request.Request(
                  url,
                  data=body,
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "anthropic-version": "2023-06-01",
                      "anthropic-beta": "experimental-cc-routine-2026-04-01",
                      "Content-Type": "application/json",
                  },
              )
              status = None
              answer_body = b""
              try:
                  with total_time_limit():
                      try:
                          with opener.open(request, timeout=TIMEOUT_SECONDS) as response:
                              # opener.open returns only a 2xx answer, so the routine trigger has accepted the request and a
                              # session may have started. The time limit ends as soon as the status is known, and the body
                              # is not read, so nothing after this can make an accepted request look not sent.
                              status = response.status
                              signal.setitimer(signal.ITIMER_REAL, 0)
                      except urllib.error.HTTPError as answer:
                          status = answer.code
                          try:
                              # Read with the time limit running, for the excerpt in the error annotation.
                              answer_body = answer.read(4096)
                          finally:
                              answer.close()
              except (OSError, http.client.HTTPException, ValueError, TotalTimeout) as failure:
                  if status is None:
                      # URLError, timeouts, refused or dropped connections, an answer cut off before its status. Only the
                      # failure's kind is reported.
                      reason = getattr(failure, "reason", failure)
                      raise NotSent(f"Could not reach the routine trigger ({type(reason).__name__}); no review was requested")
                  # The status arrived; only the rest of the answer failed or ran out of time, so the status stands.
              return status, answer_body


          def fire(token, trigger_id, decision):
              if not token:
                  raise NotSent("CLAUDE_ROUTINE_TOKEN is empty: pass it to the reusable workflow as a secret")
              if not TRIGGER_ID.fullmatch(trigger_id):
                  raise NotSent(
                      "routine-trigger-id is not a trigger id (trig_…): pass vars.CLAUDE_ROUTINE_TRIGGER_ID, set under "
                      "Settings > Secrets and variables > Actions > Variables"
                  )
              try:
                  text = json.loads(decision).get("text")
              except (ValueError, AttributeError):
                  text = None
              if not isinstance(text, str):
                  raise NotSent("The request decision has no request text; no review was requested")
              # json writes the body, so nothing in the pull request's fields can break it.
              body = json.dumps({"text": text}, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
              status, answer = post(f"{API_BASE_URL}/v1/claude_code/routines/{trigger_id}/fire", token, body)
              if not 200 <= status < 300:
                  message = f"The routine trigger answered HTTP {status}; no review was requested"
                  shown = excerpt(answer, token)
                  raise NotSent(f"{message}: {shown}" if shown else message)
              print(f"Sent the review request to the routine trigger (HTTP {status})", flush=True)


          try:
              fire(
                  os.environ.get("CLAUDE_ROUTINE_TOKEN", ""),
                  os.environ.get("TRIGGER_ID", ""),
                  os.environ.get("DECISION", ""),
              )
              # Only a request the routine trigger accepted counts as sent.
              output("sent", "true")
          except NotSent as failure:
              error(str(failure))
              sys.exit(1)
          except Exception as failure:  # Anything unexpected is reported by its kind only, and is not sent.
              error(f"Could not send the review request: the step broke ({type(failure).__name__})")
              sys.exit(1)
