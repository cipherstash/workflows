# Checks every pull request to this repository, and every push to main: lints the workflows and the example callers,
# checks the request decision's test script, runs the request decision's saved cases, and runs the unit tests of the
# reusable workflow's Python steps.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Go's module proxy and checksum database verify the pinned version. shellcheck, which actionlint uses for
      # `run:` scripts, is preinstalled on ubuntu-latest. Files are named explicitly so the example caller workflows,
      # which are not under .github/workflows, are linted too. Each error is printed as an error annotation, so it shows
      # on the check run without opening the log.
      - name: actionlint
        env:
          FORMAT: '{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}}::{{$err.Message}} [{{$err.Kind}}]{{"\n"}}{{end}}'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -format "$FORMAT" .github/workflows/*.yml examples/*.yml

  request-decision:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the test script
        run: request-decision/test-runner
      - name: Run the saved cases
        run: request-decision/test

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner's own python3 and yq; the tests need nothing installed and no network beyond 127.0.0.1.
      - name: Run the unit tests
        run: python3 -m unittest discover --start-directory tests --verbose

  # The reusable workflow's Python steps keep to Python 3.10, so they must still run there. Runs the same tests as
  # unit-tests, on the oldest supported Python. yq is the one preinstalled on ubuntu-latest, which setup-python leaves
  # on the PATH.
  unit-tests-python-3-10:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10'
      - name: Run the unit tests on Python 3.10
        run: |
          python3 --version
          yq --version
          python3 -m unittest discover --start-directory tests --verbose
